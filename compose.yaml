name: telegram-trader-phase1

services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: telegram_trader
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telegram_trader"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    restart: unless-stopped

  app:
    image: telegram-trader-phase1-app:${APP_IMAGE_TAG:-phase1}
    build:
      context: .
      target: runtime
    environment:
      APP_ENVIRONMENT: offline
      APP_DATABASE_HOST: db
      APP_DATABASE_PORT: 5432
      APP_DATABASE_NAME: telegram_trader
      APP_DATABASE_USER: postgres
      APP_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      APP_LOG_LEVEL: INFO
      APP_SERVICE_NAME: offline-foundation
      APP_HTTP_HOST: 0.0.0.0
      APP_HTTP_PORT: 8080
      BINANCE_API_BASE_URL: ${BINANCE_API_BASE_URL:-https://fapi.binance.com}
      BINANCE_SNAPSHOT_MAX_AGE_SECONDS: ${BINANCE_SNAPSHOT_MAX_AGE_SECONDS:-21600}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://api.openai.com}
      THESIS_MODEL: ${THESIS_MODEL:-gpt-4o-mini}
      THESIS_BATCH_SIZE: ${THESIS_BATCH_SIZE:-25}
      RISK_LEVERAGE: ${RISK_LEVERAGE:-5}
      RISK_DEFAULT_STOP_ROE_PCT: ${RISK_DEFAULT_STOP_ROE_PCT:-0.30}
      RISK_POSITION_SIZE_PCT: ${RISK_POSITION_SIZE_PCT:-0.20}
      RISK_MAX_CONCURRENT_POSITIONS: ${RISK_MAX_CONCURRENT_POSITIONS:-3}
      RISK_DAILY_LOSS_KILL_SWITCH_PCT: ${RISK_DAILY_LOSS_KILL_SWITCH_PCT:-0.06}
      RISK_MAX_RECEIVE_LAG_SECONDS: ${RISK_MAX_RECEIVE_LAG_SECONDS:-10}
      RISK_MAX_PRICE_DEVIATION_BPS: ${RISK_MAX_PRICE_DEVIATION_BPS:-50}
      RISK_EQUITY_BASELINE_USDT: ${RISK_EQUITY_BASELINE_USDT:-}
      RISK_DECISION_EXPIRY_SECONDS: ${RISK_DECISION_EXPIRY_SECONDS:-300}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "telegram_trader.healthcheck"]
      interval: 3s
      timeout: 4s
      retries: 20
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - internal
      - edge
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      APP_ENVIRONMENT: offline
      APP_DATABASE_HOST: db
      APP_DATABASE_PORT: 5432
      APP_DATABASE_NAME: telegram_trader_test
      APP_DATABASE_USER: postgres
      APP_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  collector:
    profiles: ["telegram"]
    image: telegram-trader-phase2-collector:${APP_IMAGE_TAG:-phase2}
    build:
      context: .
      target: runtime
    command: ["python", "-m", "telegram_trader.telegram_collector"]
    environment:
      APP_ENVIRONMENT: telegram_readonly
      APP_DATABASE_HOST: db
      APP_DATABASE_PORT: 5432
      APP_DATABASE_NAME: telegram_trader
      APP_DATABASE_USER: postgres
      APP_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      APP_LOG_LEVEL: INFO
      APP_SERVICE_NAME: telegram-readonly-collector
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_SESSION_PATH: secrets/telegram/collector
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./secrets:/app/secrets
      - ./media:/app/media
    networks:
      - internal
      - edge
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  control-bot:
    profiles: ["control-bot"]
    image: telegram-trader-phase4-control-bot:${APP_IMAGE_TAG:-phase4}
    build:
      context: .
      target: runtime
    command: ["python", "-m", "telegram_trader.control_bot"]
    environment:
      APP_ENVIRONMENT: control_bot
      APP_DATABASE_HOST: db
      APP_DATABASE_PORT: 5432
      APP_DATABASE_NAME: telegram_trader
      APP_DATABASE_USER: postgres
      APP_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      APP_LOG_LEVEL: INFO
      APP_SERVICE_NAME: control-bot
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      CONTROL_BOT_TOKEN: ${CONTROL_BOT_TOKEN:-}
      CONTROL_BOT_ALLOWLISTED_USER_ID: ${CONTROL_BOT_ALLOWLISTED_USER_ID:-}
      CONTROL_BOT_SESSION_PATH: secrets/telegram/control-bot
      BINANCE_API_BASE_URL: ${BINANCE_API_BASE_URL:-https://fapi.binance.com}
      RISK_LEVERAGE: ${RISK_LEVERAGE:-5}
      RISK_DEFAULT_STOP_ROE_PCT: ${RISK_DEFAULT_STOP_ROE_PCT:-0.30}
      RISK_POSITION_SIZE_PCT: ${RISK_POSITION_SIZE_PCT:-0.20}
      RISK_MAX_CONCURRENT_POSITIONS: ${RISK_MAX_CONCURRENT_POSITIONS:-3}
      RISK_DAILY_LOSS_KILL_SWITCH_PCT: ${RISK_DAILY_LOSS_KILL_SWITCH_PCT:-0.06}
      RISK_MAX_RECEIVE_LAG_SECONDS: ${RISK_MAX_RECEIVE_LAG_SECONDS:-10}
      RISK_MAX_PRICE_DEVIATION_BPS: ${RISK_MAX_PRICE_DEVIATION_BPS:-50}
      RISK_EQUITY_BASELINE_USDT: ${RISK_EQUITY_BASELINE_USDT:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./secrets:/app/secrets
    networks:
      - internal
      - edge
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  execution-gateway:
    profiles: ["execution-gateway"]
    image: telegram-trader-phase6-execution-gateway:${APP_IMAGE_TAG:-phase6}
    build:
      context: .
      target: runtime
    command: ["python", "scripts/execute_trade_intents.py"]
    environment:
      APP_ENVIRONMENT: execution_gateway
      APP_DATABASE_HOST: db
      APP_DATABASE_PORT: 5432
      APP_DATABASE_NAME: telegram_trader
      APP_DATABASE_USER: postgres
      APP_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      APP_LOG_LEVEL: INFO
      APP_SERVICE_NAME: execution-gateway
      BINANCE_API_BASE_URL: ${BINANCE_API_BASE_URL:-https://fapi.binance.com}
      BINANCE_TESTNET_API_KEY: ${BINANCE_TESTNET_API_KEY:-}
      BINANCE_TESTNET_API_SECRET: ${BINANCE_TESTNET_API_SECRET:-}
      BINANCE_TESTNET_BASE_URL: ${BINANCE_TESTNET_BASE_URL:-https://demo-fapi.binance.com}
      RISK_LEVERAGE: ${RISK_LEVERAGE:-5}
      RISK_MAX_CONCURRENT_POSITIONS: ${RISK_MAX_CONCURRENT_POSITIONS:-3}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - edge
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Deliberately not unless-stopped: this is a one-shot script, and an
    # auto-restart mid-order-placement after a crash is a real double-submit
    # risk this service must never have. A human re-triggers it deliberately.
    restart: "no"

volumes:
  postgres_data:

networks:
  internal:
    internal: true
  edge:
