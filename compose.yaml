name: telegram-trader-phase1

services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: telegram_trader
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telegram_trader"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped

  app:
    build:
      context: .
      target: runtime
    environment:
      APP_ENVIRONMENT: offline
      APP_DATABASE_URL: postgresql+psycopg://postgres@db:5432/telegram_trader
      APP_LOG_LEVEL: INFO
      APP_SERVICE_NAME: offline-foundation
      APP_HTTP_HOST: 0.0.0.0
      APP_HTTP_PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "telegram_trader.healthcheck"]
      interval: 3s
      timeout: 4s
      retries: 20
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - internal
      - edge
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      APP_ENVIRONMENT: offline
      APP_DATABASE_URL: postgresql+psycopg://postgres@db:5432/telegram_trader
      TEST_DATABASE_URL: postgresql+psycopg://postgres@db:5432/telegram_trader
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    internal: true
  edge:
