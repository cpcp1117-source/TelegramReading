name: Phase 1 CI

on:
  push:
    branches:
      - phase/1-offline-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: telegram_trader
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d telegram_trader"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENVIRONMENT: offline
      APP_DATABASE_URL: postgresql+psycopg://postgres:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/telegram_trader
      TEST_DATABASE_URL: postgresql+psycopg://postgres:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/telegram_trader
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.25"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
      - run: uv sync --dev --locked --no-editable
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python scripts/secret_scan.py --root .
      - run: uv run pip-audit . --strict --progress-spinner=off
      - run: uv run alembic upgrade head
      - run: uv run pytest --cov --cov-report=term-missing
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head

  compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Clean build and startup
        run: docker compose up --build --wait --wait-timeout 180 -d
      - name: Scan application image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: telegram-trader-phase1-app:phase1
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Record immutable application image identity
        run: |
          APP_IMAGE_ID=$(docker inspect --format '{{.Image}}' "$(docker compose ps -q app)")
          echo "app_image_id=$APP_IMAGE_ID"
          echo "APP_IMAGE_ID=$APP_IMAGE_ID" >> "$GITHUB_ENV"
      - name: Verify health endpoint
        run: curl --fail --silent --show-error http://127.0.0.1:8080/health/ready
      - name: Verify offline operation without egress
        run: |
          APP_CONTAINER=$(docker compose ps -q app)
          docker network disconnect telegram-trader-phase1_edge "$APP_CONTAINER"
          docker compose exec -T app python -m telegram_trader.healthcheck
          NETWORKS=$(docker inspect --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}} {{end}}' "$APP_CONTAINER")
          test "$NETWORKS" = "telegram-trader-phase1_internal "
          test "$(docker network inspect telegram-trader-phase1_internal --format '{{.Internal}}')" = "true"
      - name: Verify idempotent replay
        run: |
          docker compose exec -T app python -m telegram_trader.cli emit --consumer ci-replay --message-id 1 --sequence 1 --text first
          docker compose exec -T app python -m telegram_trader.cli emit --consumer ci-replay --message-id 1 --sequence 1 --text first
          docker compose exec -T app python -m telegram_trader.cli inspect --consumer ci-replay | tee replay.json
          grep '"receipt_count": 1' replay.json
          grep '"checkpoint": 1' replay.json
      - name: Verify checkpoint across container restart
        run: |
          docker compose restart app
          docker compose up --wait --wait-timeout 120 -d app
          test "$(docker inspect --format '{{.Image}}' "$(docker compose ps -q app)")" = "$APP_IMAGE_ID"
          docker compose exec -T app python -m telegram_trader.cli emit --consumer ci-replay --message-id 2 --sequence 2 --text second
          docker compose exec -T app python -m telegram_trader.cli inspect --consumer ci-replay | tee restart.json
          grep '"receipt_count": 2' restart.json
          grep '"checkpoint": 2' restart.json
      - name: Verify migration rollback and upgrade
        run: |
          docker compose stop app
          docker compose --profile test run --rm test alembic downgrade base
          docker compose --profile test run --rm test alembic upgrade head
      - name: Run complete test suite with coverage
        run: docker compose --profile test run --rm test pytest --cov --cov-report=term-missing
      - name: Audit container Python dependencies
        run: docker compose --profile test run --rm test pip-audit . --strict --progress-spinner=off
      - name: Capture failure logs
        if: failure()
        run: docker compose logs --no-color
      - name: Remove containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
